# Generates the catalog HTTP layer from the "catalog" tag of api/openapi.yaml.
# Run through `make generate`; never edit api.gen.go by hand.
package: httpapi
output: internal/catalog/adapters/in/httpapi/api.gen.go
generate:
  chi-server: true
  strict-server: true
  models: true
output-options:
  include-tags: [catalog]
