# Deployment example: migrations (one-shot) then API.
# DATABASE_URL et les autres variables viennent de .env (cf. .env.example).
name: meepleo-api-prod

services:
  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    restart: 'no'

  api:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8080
    ports:
      - '${PORT:-8080}:8080'
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
